name: Collecte BTC

on:
  schedule:
    - cron: "47 4 * * *"   # tous les jours à 4 h 47 UTC (5 h 47 à Paris en hiver, 6 h 47 en été)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths:
      - "collecte.py"
      - "backtest.py"
      - "outils.py"
      - "requirements.txt"
      - ".github/workflows/collecte.yml"

permissions:
  contents: write           # le robot enregistre les données dans le dépôt

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
      - name: Collecter les données
        run: python collecte.py
      - name: Lancer le backtest
        if: always()
        run: python backtest.py
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data rapport
          git diff --cached --quiet || git commit -m "Collecte du $(date -u +%F)"
          git pull --rebase --autostash
          git push
