name: Collecte BTC

on:
  schedule:
    - cron: "47 4 * * *"                 # relevé complet et backtest, tous les jours à 4 h 47 UTC
    - cron: "12 0,8,12,16,20 * * *"      # mise à jour légère après chaque clôture de bougie de 4 heures
  workflow_dispatch:                      # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths:
      - "*.py"
      - "papier/plans.csv"
      - "requirements.txt"
      - ".github/workflows/collecte.yml"

permissions:
  contents: write                         # le robot enregistre les données dans le dépôt

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
      - name: Tests sans réseau
        if: github.event_name == 'push'
        run: python tests/test_local.py
      - name: Collecter les données
        run: python collecte.py
      - name: Suivre les plans en mode papier
        if: always()
        run: python papier.py
      - name: Lancer le backtest
        if: always() && (github.event_name != 'schedule' || github.event.schedule == '47 4 * * *')
        run: python backtest.py
      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data rapport papier
          git diff --cached --quiet || git commit -m "Collecte du $(date -u +'%F %H:%M') UTC"
          git pull --rebase --autostash
          git push
